<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ko‘makAI</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:620px;margin:auto}.card{background:white;border-radius:20px;padding:18px;box-shadow:0 5px 22px #152b4a12}h1{margin:0;color:#1456a0}p{line-height:1.5;color:#526078}.sub{margin-top:4px}video{width:100%;background:#101827;border-radius:14px;aspect-ratio:4/3;object-fit:cover;margin-top:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:650;background:#1456a0;color:white}button.secondary{background:#e7eef8;color:#17385f}button:disabled{opacity:.5}.status{margin-top:12px;padding:10px;border-radius:10px;background:#eef4fc;color:#29496e;font-size:14px}.result{font-size:18px;font-weight:650;margin-top:12px}.small{font-size:12px;color:#69778c}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head><body><main class="wrap"><section class="card">
<h1>Ko‘makAI</h1><p class="sub">Ko‘zi ojiz va zaif ko‘ruvchi insonlar uchun sinov yordamchisi</p>
<video id="video" autoplay muted playsinline></video>
<div class="buttons"><button id="camera">Kamerani yoqish</button><button id="detect" class="secondary" disabled>Buyumni aniqlash</button></div>
<div id="status" class="status">AI modeli yuklanmoqda. Internetga ulangan holda kuting…</div>
<div id="result" class="result" aria-live="polite">Hozircha buyum aniqlanmadi.</div>
<p class="small">Eslatma: Bu namoyish prototipi. Aniqlash xato qilishi mumkin; yo‘lni kesib o‘tish yoki xavfli vaziyatlarda unga tayanmang.</p>
</section></main>
<script>
const video=document.getElementById('video'), cameraBtn=document.getElementById('camera'), detectBtn=document.getElementById('detect'), statusBox=document.getElementById('status'), resultBox=document.getElementById('result');
let model=null, stream=null;
const uz={person:'odam',bicycle:'velosiped',car:'mashina',motorcycle:'mototsikl',airplane:'samolyot',bus:'avtobus',train:'poyezd',truck:'yuk mashinasi',boat:'qayiq',traffic_light:'svetofor',fire_hydrant:'yong‘in gidranti',stop_sign:'to‘xtash belgisi',bench:'o‘rindiq',bird:'qush',cat:'mushuk',dog:'it',horse:'ot',sheep:'qo‘y',cow:'sigir',elephant:'fil',bear:'ayiq',zebra:'zebra',giraffe:'jirafa',backpack:'ryukzak',umbrella:'soyabon',handbag:'sumka',tie:'galstuk',suitcase:'chamadon', frisbee:'frizbi',skis:'chang‘i',snowboard:'snoubord',sports_ball:'to‘p',kite:'varrak',baseball_bat:'beysbol tayoqchasi',baseball_glove:'beysbol qo‘lqopi',skateboard:'skeytbord',surfboard:'serf doskasi',tennis_racket:'tennis raketkasi',bottle:'butilka',wine_glass:'stakan',cup:'piyola',fork:'sanchqi',knife:'pichoq',spoon:'qoshiq',bowl:'kosa',banana:'banan',apple:'olma',sandwich:'sendvich',orange:'apelsin',broccoli:'brokkoli',carrot:'sabzi',hot_dog:'xot-dog',pizza:'pitsa',donut:'ponchik',cake:'tort',chair:'stul',couch:'divan',potted_plant:'gultuvakdagi o‘simlik',bed:'karavot',dining_table:'ovqatlanish stoli',toilet:'hojatxona',tv:'televizor',laptop:'noutbuk',mouse:'sichqoncha',remote:'pult',keyboard:'klaviatura',cell_phone:'telefon',microwave:'mikroto‘lqinli pech',oven:'duxovka',toaster:'toster',sink:'rakovina',refrigerator:'muzlatkich',book:'kitob',clock:'soat',vase:'vaza',scissors:'qaychi',teddy_bear:'yumshoq ayiqcha',hair_drier:'fen',toothbrush:'tish cho‘tkasi'};
function speak(t){if(!('speechSynthesis'in window)){statusBox.textContent='Bu brauzer ovoz chiqarishni qo‘llamaydi.';return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='uz-UZ';u.rate=.9;speechSynthesis.speak(u)}
(async()=>{try{if(!window.cocoSsd)throw Error('AI kutubxonasi yuklanmadi');model=await cocoSsd.load();detectBtn.disabled=!stream;if(stream){statusBox.textContent='AI modeli tayyor. Buyumni kameraga tutib, aniqlashni bosing.';}else{statusBox.textContent='AI modeli tayyor. Kamerani yoqing.';}}catch(e){statusBox.textContent='AI modeli yuklanmadi. Internetni tekshirib, sahifani yangilang.';console.error(e)}})();
cameraBtn.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera uchun HTTPS va ruxsat kerak');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();detectBtn.disabled=!model;statusBox.textContent=model?'Kamera tayyor. Buyumni kameraga tutib, aniqlashni bosing.':'Kamera tayyor, AI modeli hali yuklanmoqda.';}catch(e){statusBox.textContent='Kamera ochilmadi: brauzer ruxsatini tekshiring. '+e.message;}};
detectBtn.onclick=async()=>{if(!model||!video.videoWidth){statusBox.textContent='Avval kamerani yoqing va AI modeli yuklanishini kuting.';return;}try{statusBox.textContent='Buyumlar aniqlanmoqda…';let p=await model.detect(video);let found=p.filter(x=>x.score>=.45).sort((a,b)=>b.score-a.score).slice(0,5);if(!found.length){resultBox.textContent='Aniq buyum topilmadi. Kamerani yaqinroq tutib qayta urinib ko‘ring.';statusBox.textContent='Aniqlash tugadi.';return;}let names=[...new Set(found.map(x=>uz[x.class]||x.class))];let sentence='Kamerada ko‘rinayotgan buyumlar: '+names.join(', ')+'.';resultBox.textContent=sentence;statusBox.textContent='Aniqlash tugadi. Natija taxminiy.';speak(sentence);}catch(e){statusBox.textContent='Aniqlashda xatolik yuz berdi.';console.error(e)}};
</script></body></html>
